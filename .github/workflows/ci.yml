name: Docker-Auth

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v3


      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
    
      

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-ci-image:${{ github.sha }}  .    

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-ci-image:${{ github.sha }}
      
      
        

      
